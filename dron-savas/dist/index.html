<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10141c">
<meta name="mobile-web-app-capable" content="yes">
<title>Dron Savaşı</title>
<style>/* Piksel arayüz: 44px dokunma alanı, en az 12px yazı, portre öncelikli; renk + ikon/şekil */
:root { --bg: #10141c; --panel: rgba(18,22,32,.94); --line: #2b2f3c; --tx: #eef1f5; --dim: #9aa1b0; --ok: #58d16a; --warn: #f0b235; --bad: #e0554b; --acc: #4b85e0; --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; touch-action: none; }
body { font-family: 'Pixel', ui-monospace, monospace; color: var(--tx); font-size: 14px; }
canvas#game { position: fixed; inset: 0; display: block; image-rendering: pixelated; touch-action: none; }
#ui { position: fixed; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }
#ui .labels, #ui .toasts, #ui .banner, #ui .debug { pointer-events: none; }
#ui .toasts > * { pointer-events: auto; }
button { font: inherit; color: inherit; }
.btn { min-height: 44px; min-width: 44px; padding: 6px 12px; border: 2px solid #0c0e14; border-bottom-width: 4px; background: #2b3242; color: var(--tx); border-radius: 0; box-shadow: inset 0 2px 0 #4a5061; font-size: 14px; cursor: pointer; line-height: 1.1; }
.btn:active { border-bottom-width: 2px; transform: translateY(2px); }
.btn.on { background: #2f5aa8; box-shadow: inset 0 2px 0 #4b85e0; }
.btn.ok { background: #2f6e3a; box-shadow: inset 0 2px 0 #46a052; }
.btn.warn { background: #7a2a26; box-shadow: inset 0 2px 0 #a8433a; }
.btn.dis { opacity: .45; }
.btn.big { font-size: 15px; padding: 8px 14px; }
.ico { image-rendering: pixelated; vertical-align: middle; margin-right: 6px; max-height: 40px; }
.small { font-size: 12px; color: var(--dim); }
.bad { color: var(--bad); } .err { color: var(--bad); font-size: 12px; }
/* üst şerit */
.topbar { position: absolute; top: 0; left: 0; right: 0; padding: calc(4px + var(--safe-t)) 6px 4px; background: linear-gradient(#0c0e14ee, #0c0e14aa); border-bottom: 2px solid #000; }
.topbar .row { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; overflow: hidden; }
.topbar .stat { font-size: 14px; white-space: nowrap; }
.stat.power.ok { color: var(--ok); } .stat.power.warn { color: var(--warn); } .stat.power.bad { color: var(--bad); }
.stat.power.bad::after { content: ' ▼'; } .stat.power.warn::after { content: ' ◆'; }
.topbar .res, .topbar .date { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .date { margin-left: auto; color: var(--tx); }
.speed { margin-left: auto; display: flex; gap: 2px; }
.speed .btn { min-width: 44px; min-height: 40px; padding: 2px 4px; font-size: 13px; }
.topbar .stat.pop { overflow: hidden; text-overflow: ellipsis; }
/* yan düğmeler */
.sidebtns { position: absolute; left: 4px; top: calc(80px + var(--safe-t)); display: flex; flex-direction: column; gap: 4px; max-height: calc(100% - 260px); overflow-y: auto; }
.btn.side { text-align: left; font-size: 12px; padding: 4px 8px; background: #1c2230e8; min-width: 44px; max-width: 128px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
@media (max-width: 520px) { .btn.side { max-width: 46px; font-size: 0; } .btn.side::first-letter { font-size: 18px; } }
.minimap { position: absolute; right: 4px; top: calc(78px + var(--safe-t)); width: 112px; height: 112px; border: 2px solid #000; outline: 2px solid #4a5061; image-rendering: pixelated; background: #0c0e14; }
/* alt şerit */
.bottombar { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 6px calc(6px + var(--safe-b)); background: linear-gradient(#0c0e14aa, #0c0e14f2); border-top: 2px solid #000; max-height: 46vh; overflow-y: auto; }
.ctx-title { font-size: 15px; margin-bottom: 4px; display: flex; align-items: center; }
.ctx-title .owner { color: var(--dim); font-size: 12px; }
.lines { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 6px; font-size: 12px; }
.kv b { color: var(--dim); font-weight: normal; }
.acts { display: flex; gap: 4px; flex-wrap: wrap; }
.acts.wrap .btn { font-size: 12px; padding: 4px 8px; }
.banner { position: absolute; left: 50%; transform: translateX(-50%); bottom: 130px; background: #f0b235; color: #10141c; padding: 8px 14px; border: 2px solid #000; font-size: 14px; }
.hidden { display: none !important; }
/* bildirimler */
.toasts { position: absolute; top: calc(78px + var(--safe-t)); left: 56px; right: 124px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.toast { background: #1c2230f0; border: 2px solid #000; border-left: 6px solid #4b85e0; padding: 6px 10px; font-size: 13px; max-width: 100%; min-height: 32px; cursor: pointer; animation: tin .2s; }
.toast.lvl0 { border-left-color: #58d16a; } .toast.lvl2 { border-left-color: #f0b235; } .toast.lvl3 { border-left-color: #e0554b; background: #3a1414f0; }
.toast.lvl3::before { content: '⚠ '; } .toast.lvl2::before { content: '◆ '; }
.toast.flash { position: fixed; left: 50%; top: 40%; transform: translateX(-50%); }
@keyframes tin { from { transform: translateX(-20px); opacity: 0; } }
.clabel { position: absolute; left: 0; top: 0; font-size: 12px; padding: 1px 4px; background: #0c0e14b0; border-bottom: 2px solid; white-space: nowrap; }
.debug { position: absolute; right: 4px; bottom: 140px; font-size: 12px; color: #fff8; }
/* paneller */
.panel { position: absolute; left: 0; right: 0; bottom: 0; top: calc(56px + var(--safe-t)); background: var(--panel); border-top: 3px solid #4a5061; display: flex; flex-direction: column; z-index: 5; }
@media (min-aspect-ratio: 4/3) { .panel { left: auto; width: min(560px, 60vw); top: 0; border-left: 3px solid #4a5061; } }
.phead { display: flex; align-items: center; padding: 6px 10px; font-size: 17px; border-bottom: 2px solid #000; }
.phead span { flex: 1; } .phead .x { min-width: 44px; }
.pbody { overflow-y: auto; padding: 8px 10px calc(16px + var(--safe-b)); flex: 1; touch-action: pan-y; }
.pbody h3 { font-size: 14px; color: var(--dim); margin: 12px 0 6px; font-weight: normal; border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; margin-bottom: 6px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
.card { background: #1c2230; border: 2px solid #000; padding: 6px; min-height: 96px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
.card.on { outline: 2px solid #4b85e0; } .card.poor { opacity: .6; } .card.locked { opacity: .35; }
.card .ico { margin: 0 0 4px; max-height: 48px; }
.cname { font-size: 12px; } .ccost, .cinfo { font-size: 12px; color: var(--dim); }
.list { display: flex; flex-direction: column; gap: 3px; }
.row { display: flex; align-items: center; gap: 6px; min-height: 44px; flex-wrap: wrap; }
.row.opt, .list > .row { background: #1c2230; padding: 4px 8px; border: 1px solid #000; cursor: pointer; }
.row.opt.on { outline: 2px solid #4b85e0; } .row.opt.locked { opacity: .4; }
.row.lvl3 { border-left: 4px solid var(--bad); } .row.lvl2 { border-left: 4px solid var(--warn); }
.grow { flex: 1; }
.stocks { display: flex; flex-wrap: wrap; gap: 4px; }
.stock { background: #1c2230; padding: 3px 6px; font-size: 12px; border: 1px solid #000; }
.branch .techs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 4px; }
.tech { background: #1c2230; border: 2px solid #000; padding: 6px; min-height: 52px; cursor: pointer; }
.tech.done { background: #1d3b23; } .tech.cur { outline: 2px solid #f0b235; } .tech.locked { opacity: .45; }
.tname { font-size: 13px; }
.country { background: #1c2230; border: 2px solid #000; padding: 6px; margin-bottom: 6px; }
.country.dead { opacity: .4; }
.flag { image-rendering: pixelated; border: 1px solid #000; }
.badge { padding: 2px 6px; font-size: 12px; border: 1px solid #000; }
.badge.s0 { background: #2b3242; } .badge.s1 { background: #8e2026; } .badge.s1::before { content: '⚔ '; } .badge.s2 { background: #6b6a2f; } .badge.s3 { background: #2f6e3a; } .badge.s3::before { content: '🤝 '; }
.chk { display: flex; align-items: center; gap: 8px; min-height: 44px; font-size: 13px; }
.chk input { width: 24px; height: 24px; }
select, input[type=number] { font: inherit; background: #0c0e14; color: var(--tx); border: 2px solid #4a5061; min-height: 40px; padding: 4px; }
input[type=range] { width: 100%; height: 40px; }
/* menü */
.menu { position: absolute; inset: 0; overflow-y: auto; padding: calc(20px + var(--safe-t)) 16px 24px; background: radial-gradient(circle at 50% 30%, #1d2c4a 0%, #0c0e14 70%); display: flex; flex-direction: column; align-items: center; touch-action: pan-y; }
.menu > * { width: 100%; max-width: 440px; }
.mtitle { text-align: center; margin: 4vh 0 3vh; }
.mtitle h1 { font-size: 34px; letter-spacing: 3px; margin: 8px 0 4px; color: #f7c948; text-shadow: 3px 3px 0 #8e2026, 6px 6px 0 #000; }
.mtitle p { color: var(--dim); margin: 0; }
.logo { image-rendering: pixelated; width: 120px; }
.mbtns { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.mbtns .btn { width: 100%; }
.menu label { display: block; margin: 14px 0 4px; color: var(--dim); font-size: 13px; }
.seg { display: flex; gap: 4px; flex-wrap: wrap; } .seg .btn { flex: 1; }
.foot { text-align: center; margin-top: 24px; }
.loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0c0e14; }
.spinner { width: 32px; height: 32px; border: 4px solid #4a5061; border-top-color: #f7c948; animation: spin 0.8s steps(8) infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.modal { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--panel); border: 3px solid #f7c948; padding: 20px; text-align: center; z-index: 9; min-width: 280px; }
.modal h1 { color: #f7c948; margin: 0 0 8px; }
.props .row { background: #3a2a10; }
</style>
</head>
