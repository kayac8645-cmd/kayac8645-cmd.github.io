<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f15">
<title>AEON — Alternatif Tarih Stratejisi</title>
<style>
:root{--bg:#0b0f15;--pn:#121821;--pn2:#18212c;--pn3:#202b38;--ln:#2b3746;--tx:#e8eef4;--mu:#9fb0c0;--ac:#f2c14e;--ac2:#4ea8ff;--rd:#ff5a5a;--gn:#46c46a;--sea:#0f2133;--sea2:#14304a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,Roboto,Arial,sans-serif}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{min-height:40px;padding:0 14px;border:1px solid var(--ln);background:var(--pn3);border-radius:8px;cursor:pointer}
button:hover{border-color:#4a5b70}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac2);outline-offset:1px}
button.pri{background:#2d5d2f;border-color:#3f8a43;font-weight:600}
button.gold{background:#5a4512;border-color:var(--ac);color:#ffe7a8;font-weight:600}
button.dng{background:#5a1e1e;border-color:#a03a3a}
button.sm{min-height:32px;padding:0 10px;font-size:13px}
button:disabled{opacity:.5;cursor:default}
select,input[type=text],input[type=password],input[type=number],input[type=search],textarea{min-height:40px;background:#0d131b;border:1px solid var(--ln);border-radius:8px;padding:6px 10px;width:100%}
textarea{resize:vertical;min-height:120px}
label{display:block;color:var(--mu);font-size:12.5px;margin:10px 0 4px}
label.chk{display:flex;align-items:center;gap:8px;color:var(--tx);font-size:14px;min-height:40px;margin:4px 0}
label.chk input{width:20px;height:20px}
h1,h2,h3{margin:0 0 8px}
h3{font-size:15px;color:var(--ac)}
a{color:var(--ac2)}
.mu{color:var(--mu)}.sm{font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:0 0 auto}
.grow{flex:1 1 auto!important}
.card{background:var(--pn2);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:10px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;border:1px solid #0006}
.chip{display:inline-block;padding:2px 8px;border-radius:12px;background:var(--pn3);border:1px solid var(--ln);margin:2px;font-size:12.5px}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11.5px;font-weight:600;color:#0b0f15}
/* üst çubuk */
#top{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--pn);border-bottom:1px solid var(--ln);flex-wrap:wrap;min-height:54px}
#logo{font-weight:800;letter-spacing:3px;color:var(--ac);font-size:18px;margin-right:4px}
#date{font-weight:600;min-width:96px}
#turnNo{color:var(--mu);font-size:12.5px}
#top select{width:auto;min-width:90px}
#top .sp{flex:1}
/* ana */
#main{flex:1;display:flex;min-height:0;position:relative}
#mapwrap{flex:1;position:relative;min-width:0;background:#070b10;touch-action:none;overflow:hidden}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map:active{cursor:grabbing}
#terr{stroke:#0b0f15;stroke-linejoin:round}
#terr path{cursor:pointer}
#labels text{fill:#f4f7fa;stroke:#0b0f15;paint-order:stroke;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central;pointer-events:none;font-weight:600}
#hlW path,#hlP path,#hlS path{fill:none;pointer-events:none}
#cities{pointer-events:none}
#cities path{fill:none;stroke-linecap:round}
#cities .cd{stroke:#0b0f15}#cit0 .cw{stroke:#e8eef4}#cit1 .cw{stroke:#f2c14e}
#cities text{fill:#e6edf3;stroke:#0b0f15;paint-order:stroke;stroke-linejoin:round;dominant-baseline:central;font-weight:500}
#cit1 text{font-weight:700;fill:#ffe7a8}
#pickBar{position:absolute;left:8px;right:8px;top:8px;display:none;gap:8px;align-items:center;flex-wrap:wrap;background:#121821f0;border:1px solid var(--ac);border-radius:10px;padding:8px 10px;z-index:6}
body.picking #pickBar{display:flex}
body.picking #side,body.picking #bEnd,body.picking #bSave,body.picking #step,body.picking #turnNo{display:none}
#zoomBtns{position:absolute;left:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
#zoomBtns button{width:42px;height:42px;padding:0;font-size:20px;background:#121821e6}
#legend{position:absolute;left:62px;bottom:10px;background:#121821e6;border:1px solid var(--ln);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--mu)}
/* yan panel */
#side{width:400px;max-width:46vw;display:flex;flex-direction:column;background:var(--pn);border-left:1px solid var(--ln);min-height:0}
#tabs{display:flex;border-bottom:1px solid var(--ln);background:var(--pn)}
#tabs button{flex:1;border:0;border-radius:0;background:transparent;min-height:48px;padding:0 4px;color:var(--mu);font-size:13.5px;border-bottom:3px solid transparent}
#tabs button[aria-selected=true]{color:var(--tx);border-bottom-color:var(--ac);background:var(--pn2)}
#sheetBtn{display:none}
#tabbody{flex:1;overflow:auto;padding:12px;-webkit-overflow-scrolling:touch}
@media (max-width:820px){
 #side{position:absolute;left:0;right:0;bottom:0;width:auto;max-width:none;height:50px;border-left:0;border-top:1px solid var(--ln);z-index:5;transition:height .18s}
 #side.open{height:60%}
 #sheetBtn{display:block;flex:0 0 44px!important;font-size:16px}
 #tabs button{font-size:12.5px}
 #zoomBtns,#legend{bottom:60px}
 #top{gap:5px;padding:5px 6px}
 #logo{font-size:15px;letter-spacing:1px;margin:0}
 #turnNo{display:none}
 #date{min-width:0;font-size:13px}
 #top select{min-width:0;padding:4px 6px}
 #top button{padding:0 9px}
 .hideM{display:none}
}
/* barlar */
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12.5px}
.bar span:first-child{width:78px;color:var(--mu)}
.bar .tr{flex:1;height:10px;background:#0d131b;border-radius:5px;overflow:hidden;border:1px solid var(--ln)}
.bar .fl{height:100%}
.bar b{width:30px;text-align:right}
/* listeler */
.ev{border-left:3px solid var(--ln);padding:6px 10px;margin:0 0 8px;background:var(--pn2);border-radius:0 8px 8px 0}
.ev .h{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ev .t{font-weight:600}
.ev .d{color:var(--mu);font-size:12px;margin-left:auto}
.ev p{margin:4px 0 0;color:#cfd8e1}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;border-bottom:1px solid var(--ln);text-align:left}
th{color:var(--mu);font-weight:500}
tr.clk{cursor:pointer}tr.clk:hover{background:var(--pn2)}
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ptabs button[aria-pressed=true]{border-color:var(--ac);background:#3a2f12}
.advice{white-space:pre-wrap;background:#0f1a14;border:1px solid #2c5a3a;border-radius:8px;padding:10px;margin-top:10px}
details{margin:8px 0}
summary{cursor:pointer;min-height:36px;display:flex;align-items:center;color:var(--ac2)}
pre{white-space:pre-wrap;word-break:break-word;background:#0d131b;border:1px solid var(--ln);border-radius:8px;padding:10px;font-size:12px;max-height:50vh;overflow:auto}
/* modallar */
.mbg{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50;padding:10px}
.mbg.on{display:flex}
.modal{background:var(--pn);border:1px solid var(--ln);border-radius:12px;width:100%;max-width:680px;max-height:92vh;overflow:auto;padding:16px}
.modal .mh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.modal .mh h2{flex:1;font-size:18px}
#setup{position:fixed;inset:0;background:radial-gradient(ellipse at top,#16263a,#0b0f15 70%);z-index:40;overflow:auto;padding:16px}
#setup .wrap{max-width:980px;margin:0 auto}
#setup h1{font-size:44px;letter-spacing:10px;color:var(--ac);margin:10px 0 0}
.scns{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin:14px 0}
.scn{text-align:left;padding:14px;min-height:150px;background:var(--pn2);border:2px solid var(--ln);border-radius:12px;display:block;width:100%}
.scn[aria-pressed=true]{border-color:var(--ac);background:#221d10}
.scn b{display:block;font-size:16px;margin-bottom:2px}
.scn i{display:block;color:var(--ac);font-style:normal;font-size:13px;margin-bottom:6px}
.scn span{color:var(--mu);font-size:13px}
.prow{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;margin-bottom:8px}
@media (max-width:560px){.prow{grid-template-columns:1fr}#setup h1{font-size:32px}}
#think .modal{max-width:420px;text-align:center}
.spin{width:38px;height:38px;border:4px solid var(--ln);border-top-color:var(--ac);border-radius:50%;margin:8px auto 12px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:#1d2a38;border:1px solid var(--ln);padding:10px 16px;border-radius:8px;z-index:90;display:none;max-width:90vw}
.ok{color:var(--gn)}.bad{color:var(--rd)}
.mlist{max-height:180px}
</style>
</head>
<body>
<header id="top">
 <span id="logo">AEON</span>
 <span><span id="date">—</span> <span id="turnNo"></span></span>
 <select id="step" aria-label="Tur adımı"><option value="1">1 ay</option><option value="3" selected>3 ay</option><option value="12">1 yıl</option><option value="60">5 yıl</option></select>
 <span class="sp"></span>
 <button id="bSet" title="Ayarlar" aria-label="Ayarlar">⚙<span class="hideM"> Ayarlar</span></button>
 <button id="bSave" title="Kayıt / Dışa aktar" aria-label="Kayıt">💾<span class="hideM"> Kayıt</span></button>
 <button id="bEnd" class="gold">▶ Turu Bitir</button>
</header>
<div id="main">
 <div id="mapwrap">
  <svg id="map" xmlns="http://www.w3.org/2000/svg" aria-label="Dünya haritası">
   <g id="vp">
    <path id="sphere" fill="#10263a" stroke="#1d3c58"/>
    <g id="terr"></g>
    <g id="hlW" stroke="#ff4545"></g>
    <g id="hlP" stroke="#f2c14e"></g>
    <g id="hlS" stroke="#ffffff"></g>
    <g id="cities"></g>
    <g id="labels"></g>
   </g>
  </svg>
  <div id="zoomBtns"><button id="zIn" aria-label="Yakınlaştır">+</button><button id="zOut" aria-label="Uzaklaştır">−</button><button id="zFit" aria-label="Sığdır">⌂</button></div>
  <div id="pickBar" role="region" aria-label="Ülke seçimi"></div>
  <div id="legend" class="hideM"><span style="color:#f2c14e">▬</span> oyuncu &nbsp; <span style="color:#ff4545">▬</span> savaşta &nbsp; <span style="color:#fff">┅</span> seçili</div>
 </div>
 <aside id="side">
  <div id="tabs" role="tablist" aria-label="Paneller">
   <button role="tab" data-tab="orders" aria-selected="true">Emir</button>
   <button role="tab" data-tab="country" aria-selected="false">Ülke</button>
   <button role="tab" data-tab="news" aria-selected="false">Haberler</button>
   <button role="tab" data-tab="world" aria-selected="false">Dünya</button>
   <button role="tab" data-tab="diplo" aria-selected="false">Diplomasi</button>
   <button id="sheetBtn" aria-label="Paneli aç/kapat">▲</button>
  </div>
  <div id="tabbody" role="tabpanel" tabindex="0"></div>
 </aside>
</div>

<div id="setup">
 <div class="wrap">
  <h1>AEON</h1>
  <p class="mu">Yapay zekâ hakemli alternatif tarih büyük stratejisi. Emirlerini serbest metinle yaz; hakem dünyayı simüle etsin.</p>
  <div class="scns" id="scns"></div>
  <div class="card">
   <div class="row"><label style="margin:0">Oyuncu sayısı (aynı ekran)</label><select id="pcount" style="width:auto"><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
   <div id="plist" style="margin-top:10px"></div>
  </div>
  <div class="row">
   <button class="gold" id="bStart">▶ Başlat</button>
   <button id="bResume" style="display:none">⟳ Kayıtlı oyunu sürdür</button>
   <button id="bLoadFile">⬆ Kayıtlı oyunu yükle (dosya)</button>
   <button id="bSet2">⚙ Ayarlar</button>
  </div>
  <p class="mu sm" id="provInfo"></p>
 </div>
</div>

<div class="mbg" id="think"><div class="modal" role="dialog" aria-modal="true" aria-label="Hakem">
 <div id="thinkRun"><div class="spin"></div><h3>Hakem düşünüyor…</h3><p class="mu" id="thinkT">0 sn</p><button id="bCancel" class="dng">İptal</button></div>
 <div id="thinkErr" style="display:none"><h3 class="bad">Tur tamamlanamadı</h3><p id="thinkMsg"></p><p class="mu sm">Oyun durumu değişmedi.</p><div class="row" style="justify-content:center"><button class="pri" id="bRetry">Yeniden dene</button><button id="bRaw1">Ham yanıt</button><button id="bThinkClose">Kapat</button></div></div>
</div></div>

<div class="mbg" id="mRes"><div class="modal" role="dialog" aria-modal="true"><div class="mh"><h2 id="resTitle">Tur sonucu</h2><button data-close aria-label="Kapat">✕</button></div><div id="resBody"></div><div class="row" style="margin-top:10px"><button class="pri" data-close>Devam</button><button id="bRaw2">Ham yanıtı göster</button></div></div></div>

<div class="mbg" id="mSet"><div class="modal" role="dialog" aria-modal="true"><div class="mh"><h2>⚙ Ayarlar</h2><button data-close aria-label="Kapat">✕</button></div><div id="setBody"></div></div></div>

<div class="mbg" id="mSave"><div class="modal" role="dialog" aria-modal="true"><div class="mh"><h2>💾 Kayıt</h2><button data-close aria-label="Kapat">✕</button></div><div id="saveBody"></div></div></div>

<div class="mbg" id="mRaw"><div class="modal" role="dialog" aria-modal="true"><div class="mh"><h2>Ham yanıt</h2><button id="bCopyRaw" class="sm">Kopyala</button><button data-close aria-label="Kapat">✕</button></div><pre id="rawBody"></pre></div></div>

<input type="file" id="fileIn" accept=".json,application/json" style="display:none">
<div id="toast" role="status" aria-live="polite"></div>

function ranking(){const c=countMap();return aliveIds().map(id=>({id,c:c[id]||0,p:power(id,c)})).sort((a,b)=>b.p-a.p);}

function buildScenario(sid){

 const viaT=tn=>{const o=S.own[tn];if(o&&terrsOf(o).length<=2){dbg(`"${raw}" → ${o} (bölge sahibi)`);return o;}return null;};
 if(k in ALIAS){const c=ALIAS[k];if(!c)return null;if(S.nations[c])return c;if(T[c]){const o=viaT(c);if(o)return o;}}
 {const tn=IDX.t[k];if(tn){const o=viaT(tn);if(o)return o;}}
 if(k.length>=4){const c=Object.keys(IDX.n).filter(z=>z.length>=4&&(z.startsWith(k)||k.startsWith(z)));const u=[...new Set(c.map(z=>IDX.n[z]))];if(u.length===1)return u[0];}
 return null;
}
function resolveTerr(x){
 if(x==null)return null;const raw=String(x).trim();if(!raw)return null;
 if(T[raw])return raw;
 if(!IDX)buildIdx();
 const k=key(raw);if(!k)return null;
 if(IDX.t[k])return IDX.t[k];
 if(k in ALIAS){const c=ALIAS[k];if(c&&T[c])return c;}
 const nid=IDX.n[k];if(nid){const ts=terrsOf(nid);if(ts.length===1)return ts[0];}
 if(k.length>=4){const c=Object.keys(IDX.t).filter(z=>z.length>=4&&(z.startsWith(k)||k.startsWith(z)));const u=[...new Set(c.map(z=>IDX.t[z]))];if(u.length===1)return u[0];}
 return null;
}
function resolveList(a){const out=[];for(const x of arr(a)){const r=resolveNation(x,true);if(r&&S.nations[r].alive&&!out.includes(r))out.push(r);else if(!r)dbg(`Devlet çözülemedi: "${str(x,60)}"`);}return out;}
function findAlliance(name){const k=key(name);if(!k)return null;return S.alli.find(a=>key(a.n)===k)||S.alli.find(a=>{const z=key(a.n);return z.length>=3&&(z.includes(k)||k.includes(z));})||null;}

/* ---- yaşam döngüsü ---- */
function lifecycle(rep){
 const c=countMap();
 for(const id in S.nations){
  const n=S.nations[id],has=!!c[id];
  if(n.alive&&!has){n.alive=false;rep.ok.push("☠ "+n.tr+" tarihe karıştı");S.log.push({date:S.date,type:"politics",title:n.tr+" devleti sona erdi",text:n.tr+" son toprağını da kaybetti ve haritadan silindi.",nations:[id]});}
  else if(!n.alive&&has)n.alive=true;
 }
 for(const a of S.alli)a.m=a.m.filter(x=>S.nations[x]&&S.nations[x].alive);
 S.alli=S.alli.filter(a=>a.m.length>1);
 for(const w of S.wars){w.a=w.a.filter(x=>S.nations[x].alive);w.b=w.b.filter(x=>S.nations[x].alive);}
 S.wars=S.wars.filter(w=>{if(w.a.length&&w.b.length)return true;rep.ok.push("🏳 "+w.name+" sona erdi (bir taraf yok oldu)");return false;});
}
function trimLog(){
 if(S.log.length<=300)return;
 const old=S.log.splice(0,61);
 S.log.unshift({date:old[0].date,type:"archive",title:`Arşiv: ${fmtDate(old[0].date)} – ${fmtDate(old[old.length-1].date)} (${old.length} kayıt)`,text:old.filter(e=>e.type!=="archive").slice(-14).map(e=>e.title).join(" · "),nations:[]});
}

/* ---- hakem çıktısını doğrula ve uygula ---- */
function applyResult(R,months){
 const rep={ok:[],rej:[]};
 const ch=(R.changes&&typeof R.changes==="object")?R.changes:{};
 const cap=Math.floor(4+2*Math.sqrt(months));
 const collapseAll=R.collapse===true||ch.collapse===true;
 const start=countMap(),lost={};
 const canLose=(nid,kind)=>{if(collapseAll||kind==="collapse")return true;const lim=Math.max(1,Math.floor((start[nid]||0)/2));return (lost[nid]||0)<lim;};
 const moveT=(t,to)=>{const from=S.own[t];lost[from]=(lost[from]||0)+1;S.own[t]=to;S.nations[to].alive=true;};
 const rej=m=>{rep.rej.push(m);dbg("Reddedildi: "+m);};

 // 1) yeni devletler
 for(const nn of arr(ch.new_nations)){
  if(!nn||typeof nn!=="object")continue;
  let id=str(nn.id||nn.tr,40);if(!id){rej("Kimliksiz yeni devlet");continue;}
  const ts=[];arr(nn.territories).forEach(x=>{const t=resolveTerr(x);if(t&&!ts.includes(t))ts.push(t);else if(!t)dbg(`Bölge çözülemedi: "${str(x,60)}"`);});
  if(!ts.length){rej(`Yeni devlet ${id}: geçerli bölge yok`);continue;}
  const parent=resolveNation(nn.from,true)||S.own[ts[0]];
  const pn=S.nations[parent]||{eco:30,mil:20,stab:40,tech:20};
  const exists=!!S.nations[id];
  const acc=ts.filter(t=>{if(S.own[t]===id)return false;if(!canLose(S.own[t],"independence")){rej(`${t} → ${id}: aynı turda devletin bölgelerinin yarısından fazlası el değiştiremez`);return false;}return true;});
  if(!acc.length)continue;
  if(!exists){
   const num=(v,d)=>clamp(Math.round(isFinite(+v)&&v!==""&&v!=null?+v:d),0,100);
   S.nations[id]={id,tr:str(nn.tr||TRN[id]||id,50),col:/^#[0-9a-f]{6}$/i.test(nn.col)?nn.col:hashColor(id),gov:str(nn.gov||"Geçici hükümet",60),leader:str(nn.leader||"—",60),
    eco:num(nn.eco,pn.eco*0.6),mil:num(nn.mil,pn.mil*0.5),stab:num(nn.stab,35),tech:num(nn.tech,pn.tech*0.8),alive:true};
   IDX=null;
  }else{const n=S.nations[id];if(!n.alive){if(nn.leader)n.leader=str(nn.leader,60);if(nn.gov)n.gov=str(nn.gov,60);}}
  acc.forEach(t=>moveT(t,id));
  rep.ok.push(`🏳 ${exists?"Yeniden doğuş":"Yeni devlet"}: ${S.nations[id].tr} (${acc.join(", ")})`);
  S.log.push({date:S.date,type:"territory",title:(exists?"Yeniden kuruldu: ":"Yeni devlet: ")+S.nations[id].tr,text:`${acc.map(t=>TRN[t]||t).join(", ")} ${trn(parent)} yönetiminden ayrıldı.`,nations:[id,parent].filter(Boolean)});
 }
 // 2) liderler
 for(const l of arr(ch.leaders)){const n=resolveNation(l&&l.nation,true);if(!n){dbg(`Lider: devlet çözülemedi "${str(l&&l.nation,50)}"`);continue;}
  if(l.leader){S.nations[n].leader=str(l.leader,60);}if(l.gov){S.nations[n].gov=str(l.gov,60);}rep.ok.push(`👤 ${trn(n)}: ${S.nations[n].leader}`);}
 // 3) istatistikler
 for(const s of arr(ch.stats)){const n=resolveNation(s&&s.nation,true);if(!n){dbg(`İstatistik: devlet çözülemedi "${str(s&&s.nation,50)}"`);continue;}
  const parts=[];
  for(const k of ["eco","mil","stab","tech"]){let d=Math.round(+s[k]);if(!isFinite(d)||!d)continue;if(Math.abs(d)>cap){dbg(`${n}.${k} delta ${d} → ±${cap} kırpıldı`);d=d>0?cap:-cap;}
   S.nations[n][k]=clamp(S.nations[n][k]+d,0,100);parts.push(k+(d>0?"+":"")+d);}
  if(parts.length)rep.ok.push(`📊 ${trn(n)}: ${parts.join(" ")}`);}
 // 4) ilişkiler
 for(const r of arr(ch.relations)){const a=resolveNation(r&&r.a,true),b=resolveNation(r&&r.b,true);if(!a||!b||a===b){dbg(`İlişki atlandı: ${str(r&&r.a,40)}|${str(r&&r.b,40)}`);continue;}
  let d=Math.round(+r.delta);if(!isFinite(d)||!d)continue;d=clamp(d,-40,40);setRel(a,b,getRel(a,b)+d);}
 // 5) ittifaklar
 for(const al of arr(ch.alliances)){
  if(!al)continue;const op=String(al.op||"").toLowerCase();const name=str(al.name,60);
  const nat=resolveNation(al.nation,true);const mem=resolveList(al.members);if(nat&&S.nations[nat].alive&&!mem.includes(nat))mem.push(nat);
  let ex=findAlliance(name);
  if(op==="create"||(op==="join"&&!ex)){
   if(ex){mem.forEach(x=>{if(!ex.m.includes(x))ex.m.push(x);});rep.ok.push(`🤝 ${ex.n} genişledi`);continue;}
   if(mem.length<2){rej(`İttifak "${name}": en az 2 geçerli üye gerekli`);continue;}
   S.alli.push({n:name||("İttifak: "+mem.map(trn).join("-")),m:mem});rep.ok.push(`🤝 Yeni ittifak: ${name} (${mem.map(trn).join(", ")})`);
   S.log.push({date:S.date,type:"diplomacy",title:"İttifak kuruldu: "+(name||"yeni ittifak"),text:mem.map(trn).join(", "),nations:mem});
  }else if(op==="join"){mem.forEach(x=>{if(!ex.m.includes(x))ex.m.push(x);});rep.ok.push(`🤝 ${ex.n}: katılım (${mem.map(trn).join(", ")})`);}
  else if(op==="leave"){if(!ex){dbg(`Ayrılma: ittifak yok "${name}"`);continue;}ex.m=ex.m.filter(x=>!mem.includes(x));rep.ok.push(`↩ ${ex.n}: ayrılan ${mem.map(trn).join(", ")}`);if(ex.m.length<2){S.alli=S.alli.filter(a=>a!==ex);rep.ok.push(`✖ ${ex.n} dağıldı`);}}
  else if(op==="dissolve"){if(!ex){dbg(`Fesih: ittifak yok "${name}"`);continue;}S.alli=S.alli.filter(a=>a!==ex);rep.ok.push(`✖ ${ex.n} feshedildi`);}
  else dbg(`Bilinmeyen ittifak işlemi: ${op}`);
 }
 // 6) savaşlar
 let wk=0;
 for(const w of arr(ch.wars)){
  if(!w)continue;const op=String(w.op||"").toLowerCase();
  const A=resolveList(w.side_a);let B=resolveList(w.side_b).filter(x=>!A.includes(x));
  if(op==="start"){
   if(!A.length||!B.length){rej(`Savaş "${str(w.name,60)}": tarafları geçersiz`);continue;}
   let ex=S.wars.find(x=>(A.some(y=>x.a.includes(y))&&B.some(y=>x.b.includes(y)))||(A.some(y=>x.b.includes(y))&&B.some(y=>x.a.includes(y))));
   if(ex){const flip=A.some(y=>ex.b.includes(y));const [sa,sb]=flip?[ex.b,ex.a]:[ex.a,ex.b];A.forEach(x=>{if(!sa.includes(x)&&!sb.includes(x))sa.push(x);});B.forEach(x=>{if(!sb.includes(x)&&!sa.includes(x))sb.push(x);});rep.ok.push(`⚔ ${ex.name} genişledi`);}
   else{const name=str(w.name,80)||`${trn(A[0])}–${trn(B[0])} Savaşı`;const id=str(w.id,40)||("w"+S.turn+"_"+(wk++)+"_"+hashStr(name).toString(36));
    S.wars.push({id:S.wars.some(x=>x.id===id)?id+"_"+S.turn:id,name,a:A,b:B,since:S.date});rep.ok.push(`⚔ Savaş başladı: ${name}`);
    S.log.push({date:S.date,type:"war",title:"Savaş ilanı: "+name,text:A.map(trn).join(", ")+" ile "+B.map(trn).join(", ")+" arasında çatışma başladı.",nations:A.concat(B)});}
   A.forEach(a=>B.forEach(b=>{if(getRel(a,b)>-50)setRel(a,b,-50);}));
   // ittifak bloklarının birbirine düşmemesi: savaşta karşı taraflar ittifaktan çıkar
   S.alli.forEach(al=>{if(A.some(x=>al.m.includes(x))&&B.some(x=>al.m.includes(x))){const rm=B.filter(x=>al.m.includes(x));al.m=al.m.filter(x=>!rm.includes(x));dbg(`${al.n}: savaş nedeniyle ${rm.join(",")} çıkarıldı`);}});
   S.alli=S.alli.filter(a=>a.m.length>1);
  }else if(op==="end"){
   let ex=null;const id=str(w.id,40),nk=key(w.name);
   if(id)ex=S.wars.find(x=>x.id===id);
   if(!ex&&nk)ex=S.wars.find(x=>key(x.name)===nk)||S.wars.find(x=>{const z=key(x.name);return z.length>3&&(z.includes(nk)||nk.includes(z));});
   if(!ex&&A.length&&B.length)ex=S.wars.find(x=>(A.some(y=>x.a.includes(y))&&B.some(y=>x.b.includes(y)))||(A.some(y=>x.b.includes(y))&&B.some(y=>x.a.includes(y))));
   if(!ex){rej(`Bitirilecek savaş bulunamadı: "${str(w.name||w.id,60)}"`);continue;}
   S.wars=S.wars.filter(x=>x!==ex);rep.ok.push(`🕊 Savaş sona erdi: ${ex.name}`);
   S.log.push({date:S.date,type:"war",title:"Barış: "+ex.name,text:ex.name+" "+fmtDate(ex.since)+" tarihinden beri sürüyordu ve sona erdi.",nations:ex.a.concat(ex.b)});
  }else dbg(`Bilinmeyen savaş işlemi: ${op}`);
 }
 // 7) bölge devirleri
 const SOFT=["treaty","independence","annexation","cession","collapse"];
 for(const tr of arr(ch.transfers)){
  if(!tr)continue;const t=resolveTerr(tr.territory),to=resolveNation(tr.to,true);
  if(!t){rej(`Bölge çözülemedi: "${str(tr.territory,60)}"`);continue;}
  if(!to){rej(`Alıcı devlet çözülemedi: "${str(tr.to,60)}" (${t})`);continue;}
  const from=S.own[t];if(from===to)continue;
  const kind=String(tr.kind||"").toLowerCase();
  const adj=T[t].nb.some(x=>S.own[x]===to&&x!==t);
  if(!(adj||S.nations[to].mil>=60||SOFT.includes(kind))){rej(`${t} → ${trn(to)}: komşuluk yok, ordu < 60 ve tür "${kind||"?"}"`);continue;}
  if(!canLose(from,kind)){rej(`${t} → ${trn(to)}: ${trn(from)} bu tur bölgelerinin yarısından fazlasını kaybedemez`);continue;}
  moveT(t,to);rep.ok.push(`🗺 ${TRN[t]||t}: ${trn(from)} → ${trn(to)} (${kind||"devir"})`);
  S.log.push({date:S.date,type:"territory",title:`${TRN[t]||t} (${capitalOf(t)}) el değiştirdi`,text:`${TRN[t]||t}, ${trn(from)} yönetiminden ${trn(to)} yönetimine geçti${tr.reason?": "+str(tr.reason,200):"."}`,nations:[from,to]});
 }
 // 8) yaşam döngüsü
 lifecycle(rep);
 // 9) olaylar
 for(const e of arr(R.events)){
  if(!e||typeof e!=="object")continue;
  const type=EVT[e.type]&&!["system","archive","territory"].includes(e.type)?e.type:"politics";
  S.log.push({date:S.date,type,title:str(e.title||R.headline||"Gelişme",140),text:str(e.text,700),nations:arr(e.nations).map(x=>resolveNation(x,true)).filter(Boolean).slice(0,8)});
 }
 trimLog();
 IDX=null;
 return rep;
}
function commitTurn(R,months){
 const from=S.date;
 S.date=addMonths(S.date,months);
 const rep=applyResult(R,months);
 S.turn++;
 const fb=arr(R.player_feedback).map(f=>({player:str(f&&f.player,40),result:str(f&&f.result,800),advice:str(f&&f.advice,300)}));
 S.hist.push({turn:S.turn,from,date:S.date,headline:str(R.headline||"Yeni dönem",160),fb,hooks:arr(R.hooks).map(h=>str(h,240)).slice(0,4),ok:rep.ok.length,rej:rep.rej.length});
 if(S.hist.length>80)S.hist.splice(0,S.hist.length-80);
 S.players.forEach(p=>{p.last=p.orders;p.orders="";});
 return rep;
}

/* ---- hakeme giden sıkıştırılmış durum ---- */
function compress(months){
 const sc=SCN.find(s=>s.id===S.scenario);
 const nations={},tbo={};
 aliveIds().forEach(id=>{const n=S.nations[id];nations[id]={gov:n.gov,leader:n.leader,eco:n.eco,mil:n.mil,stab:n.stab,tech:n.tech};});
 for(const t in S.own)(tbo[S.own[t]]=tbo[S.own[t]]||[]).push(t);
 const relations=[];for(const k in S.rel){const v=S.rel[k];if(Math.abs(v)>=30){const [a,b]=k.split("|");if(S.nations[a]&&S.nations[a].alive&&S.nations[b]&&S.nations[b].alive)relations.push([a,b,v]);}}
 return {date:S.date,step_months:months,scenario:sc?sc.title+" ("+sc.date.slice(0,4)+")":S.scenario,
  players:S.players.map(p=>({name:p.name,nation:p.nation,orders:p.orders||"(no orders)"})),
  nations,territories_by_owner:tbo,
  major_cities_by_territory:Object.fromEntries(Object.keys(CITY_BY_T).map(t=>[t,CITY_BY_T[t].map(c=>c[0]+(c[5]?"*":""))])),
  relations,
  alliances:S.alli.map(a=>({name:a.n,members:a.m})),
  wars:S.wars.map(w=>({id:w.id,name:w.name,side_a:w.a,side_b:w.b,since:w.since})),
  recent_events:S.log.filter(e=>e.type!=="archive"&&e.type!=="system").slice(-12).map(e=>e.title)};
}

/* ---- MOCK hakem (API yok) ---- */
function mockReferee(months){
 const R={headline:"",events:[],changes:{stats:[],relations:[],transfers:[],new_nations:[],leaders:[],alliances:[],wars:[]},player_feedback:[],hooks:[]};
 const C=R.changes,rnd=Math.random,ri=n=>Math.floor(rnd()*n),pick=a=>a[ri(a.length)],ch=p=>rnd()<p;
 const rank=ranking(),alive=rank.map(r=>r.id),big=alive.slice(0,30);
 const st=(n,o)=>C.stats.push(Object.assign({nation:n,eco:0,mil:0,stab:0,tech:0},o));
 const ev=(type,title,text,ns)=>R.events.push({type,title,text,nations:ns});
 const neighborsOf=id=>{const s=new Set();terrsOf(id).forEach(t=>T[t].nb.forEach(x=>{if(S.own[x]!==id)s.add(S.own[x]);}));return [...s];};
 const frontier=(att,def)=>terrsOf(def).filter(t=>T[t].nb.some(x=>S.own[x]===att));
 const names=alive.map(id=>[id,fold(trn(id)).replace(/[^a-z0-9]+/g," ").trim(),fold(id).replace(/[^a-z0-9]+/g," ").trim()]);
 const findIn=(txt,me)=>{const t=" "+fold(txt).replace(/[^a-z0-9]+/g," ")+" ";let best=null,bl=0;for(const [id,a,b] of names){if(id===me)continue;for(const nm of [a,b]){if(nm.length>=3&&t.includes(" "+nm)&&nm.length>bl){best=id;bl=nm.length;}}}return best;};
 const used=new Set();
 // oyuncu emirleri
 for(const p of S.players){
  const me=p.nation,o=(p.orders||"").trim(),lo=fold(o);
  if(!o){R.player_feedback.push({player:p.name,result:"Bu dönem emir verilmedi; devlet olağan yönetimle yoluna devam etti.",advice:"Hedef, araç ve süre belirten net emirler verin."});continue;}
  const res=[],tg=findIn(o,me),M=NAT(me);
  if(tg){
   const T2=NAT(tg);used.add(tg);
   if(/savas|saldir|isgal|fethet|harekat|war|invade|attack/.test(lo)){
    if(!atWar(me,tg)){C.wars.push({op:"start",name:`${trn(me)}–${trn(tg)} Savaşı`,side_a:[me],side_b:[tg]});res.push(`${trn(tg)} ile savaş başladı`);ev("war",`${trn(me)}, ${trn(tg)} ile savaşa girdi`,`${trn(me)} hükümeti seferberlik ilan etti; ${trn(tg)} sınırında birlikler harekete geçti.`,[me,tg]);}
    const fr=frontier(me,tg),edge=M.mil-T2.mil+(rnd()*40-20);
    if(fr.length&&edge>8&&ch(0.55)){const t=pick(fr);C.transfers.push({territory:t,to:me,kind:"conquest",reason:"Başarılı askerî harekât"});res.push(`${TRN[t]||t} bölgesi ve ${capitalOf(t)} ele geçirildi`);}
    else if(!fr.length&&M.mil<60)res.push("lojistik yetersiz: ortak sınır yok, harekât sınırlı kaldı");
    else res.push("cephe hattı büyük ölçüde sabit kaldı");
    st(me,{eco:-1,mil:-1,stab:ch(.5)?-1:0});st(tg,{eco:-2,stab:-2});
   }
   if(/ittifak|pakt|alliance|ortaklik/.test(lo)){const r=getRel(me,tg);if(r>=25&&ch(.6)){C.alliances.push({op:"create",name:`${trn(me)}-${trn(tg)} Paktı`,members:[me,tg]});res.push(`${trn(tg)} ittifak teklifini kabul etti`);}else res.push(`${trn(tg)} ittifak teklifine temkinli yaklaştı`);C.relations.push({a:me,b:tg,delta:8+ri(10)});}
   if(/ambargo|yaptirim|sanction|embargo|abluka/.test(lo)){C.relations.push({a:me,b:tg,delta:-(10+ri(12))});st(tg,{eco:-2});st(me,{eco:-1});res.push(`${trn(tg)} ekonomisi ambargodan etkilendi`);ev("economy",`${trn(me)}, ${trn(tg)}'ye ambargo uyguladı`,"Ticaret yolları daraldı, piyasalar tedirgin.",[me,tg]);}
   if(/yardim|destek|aid|bagis/.test(lo)){C.relations.push({a:me,b:tg,delta:6+ri(8)});st(me,{eco:-1});st(tg,{stab:1,eco:1});res.push(`${trn(tg)} yardımı minnetle karşıladı`);}
   if(/baris|ateskes|peace|ceasefire|muzakere/.test(lo)&&atWar(me,tg)){if(ch(.5)){C.wars.push({op:"end",side_a:[me],side_b:[tg]});res.push("ateşkes imzalandı");}else res.push("barış görüşmeleri sonuçsuz kaldı");}
   if(/ilhak|annex/.test(lo)&&!atWar(me,tg)){const fr=frontier(me,tg);if(fr.length&&T2.stab<35&&M.mil>T2.mil+20&&ch(.5)){C.transfers.push({territory:pick(fr),to:me,kind:"annexation",reason:"Zayıf komşunun ilhakı"});res.push("ilhak gerçekleşti");}else{res.push("ilhak girişimi uluslararası tepkiyle durdu");C.relations.push({a:me,b:tg,delta:-20});}}
  }

async function llm(messages,o){
 o=o||{};
 const ep=endpoint();if(!ep.model)throw new ApiErr("model","Model seçilmemiş (Ayarlar).");
 let useJson=!!(o.json&&SET.jsonMode&&!NOJSON[ep.model]);
 for(let attempt=0;attempt<2;attempt++){
  const body={model:ep.model,messages,temperature:+SET.temp,max_tokens:o.maxTokens||(+SET.maxTokens|0)||4096};
  if(useJson)body.response_format={type:"json_object"};
  let res,txt;
  try{res=await fetch(ep.url,{method:"POST",headers:ep.h,body:JSON.stringify(body),signal:o.signal});txt=await res.text();}
  catch(e){if(e&&e.name==="AbortError")throw e;throw new ApiErr("net",CORS_MSG,String(e));}
  if(res.status===400&&useJson){useJson=false;NOJSON[ep.model]=true;dbgSafe("HTTP 400: response_format olmadan yeniden deneniyor");continue;}
  if(!res.ok)throw httpErr(res.status,txt,ep.model);
  let j;try{j=JSON.parse(txt);}catch(e){throw new ApiErr("bad","Sağlayıcıdan JSON olmayan yanıt geldi.",txt);}
  if(j.error)throw new ApiErr("prov","Sağlayıcı hatası: "+String(j.error.message||JSON.stringify(j.error)).slice(0,300),txt);
  const m=j.choices&&j.choices[0]&&j.choices[0].message;
  const c=m?(m.content||m.reasoning_content||m.reasoning||""):"";
  if(!c)throw new ApiErr("empty","Model boş yanıt döndürdü (max_tokens yetersiz olabilir).",txt);
  return typeof c==="string"?c:JSON.stringify(c);
 }
 throw new ApiErr("bad","İstek başarısız.");
}

 return s.trim();
}
function extractJSON(raw){
 let s=cleanText(raw).replace(/```(?:json|JSON)?/g,"");
 let from=0;
 while(true){
  const st=s.indexOf("{",from);if(st<0)throw new Error("JSON nesnesi bulunamadı");
  let d=0,inS=false,esc=false,end=-1;
  for(let i=st;i<s.length;i++){const c=s[i];
   if(inS){if(esc)esc=false;else if(c==="\\")esc=true;else if(c==='"')inS=false;continue;}
   if(c==='"')inS=true;else if(c==="{")d++;else if(c==="}"){d--;if(d===0){end=i;break;}}}
  if(end<0)throw new Error("Dengeli { } bloğu bulunamadı (yanıt kesilmiş olabilir)");
  const sub=s.slice(st,end+1);
  try{return JSON.parse(sub);}catch(e){try{return JSON.parse(sub.replace(/,\s*([}\]])/g,"$1"));}catch(e2){from=st+1;if(from>=s.length)throw e;}}
 }
}

 }

function mockAdvice(id){
 const n=NAT(id),r=ranking(),pos=r.findIndex(x=>x.id===id)+1;
 const nbs=[...new Set(terrsOf(id).flatMap(t=>T[t].nb).map(t=>S.own[t]).filter(x=>x!==id))];
 const foe=nbs.slice().sort((a,b)=>getRel(id,a)-getRel(id,b))[0],friend=nbs.slice().sort((a,b)=>getRel(id,b)-getRel(id,a))[0];
 const wars=S.wars.filter(w=>w.a.includes(id)||w.b.includes(id));
 const weak=[["eco","ekonomi"],["mil","ordu"],["stab","istikrar"],["tech","teknoloji"]].sort((a,b)=>n[a[0]]-n[b[0]])[0];
 return `Durum: ${n.tr} dünya güç sıralamasında ${pos}. sırada; en zayıf alanımız ${weak[1]} (${n[weak[0]]}). ${wars.length?"Şu an "+wars.map(w=>w.name).join(", ")+" içindeyiz.":"Aktif bir savaşımız yok"}${foe?", en gergin komşumuz "+trn(foe)+".":"."}
